name: Build Prince Chat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold, Add Permissions & Set Official Logo
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.princechat --project-name prince_chat .
          fi
          # Add Internet permissions
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          
          # Download and set official logo as Android App Icon
          LOGO_URL="https://prince-cloud.onrender.com/files/a1394e6df10b.png"
          for dir in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$dir"
            curl -sL "$LOGO_URL" -o "android/app/src/main/res/mipmap-$dir/ic_launcher.png"
          done

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK to Download
        uses: actions/upload-artifact@v4
        with:
          name: PRINCE-CHAT-APK
          path: build/app/outputs/flutter-apk/app-release.apk
