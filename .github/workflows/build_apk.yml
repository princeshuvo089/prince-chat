name: Build Prince Chat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android Files & Add Internet Permission
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.princechat --project-name prince_chat .
          fi
          # Add Internet permission to AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK to Download
        uses: actions/upload-artifact@v4
        with:
          name: PRINCE-CHAT-APK
          path: build/app/outputs/flutter-apk/app-release.apk
