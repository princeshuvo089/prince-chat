name: prince_chat
description: "PRINCE CHAT - Real-time cloud messaging application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & Supabase
  supabase_flutter: ^2.8.0

  # Storage & Plugins (Fixed Versions)
  shared_preferences: ^2.3.2
  shared_preferences_android: ^2.4.0

  # State & Tools
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
